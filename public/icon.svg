<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#191138" />
      <stop offset="50%" stop-color="#120c24" />
      <stop offset="100%" stop-color="#0a0715" />
    </linearGradient>
    <linearGradient id="heartGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fda4af" />
      <stop offset="40%" stop-color="#f43f5e" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <!-- Background with squircle safe padding -->
  <rect width="512" height="512" rx="112" fill="url(#bg)" />
  <!-- Subtle halo ring -->
  <circle cx="256" cy="256" r="160" fill="none" stroke="rgba(244, 63, 94, 0.15)" stroke-width="4" />
  <!-- Glowing Heart -->
  <path d="M256 410 C256 410 110 300 110 190 C110 135 152 95 206 95 C236 95 264 112 256 138 C248 112 276 95 306 95 C360 95 402 135 402 190 C402 300 256 410 256 410 Z" fill="url(#heartGrad)" filter="url(#glow)" />
  <!-- Constellation sparks -->
  <circle cx="160" cy="150" r="4" fill="#ffffff" opacity="0.8" />
  <circle cx="350" cy="140" r="5" fill="#ffffff" opacity="0.9" />
  <circle cx="256" cy="70" r="3" fill="#fda4af" opacity="0.7" />
</svg>
